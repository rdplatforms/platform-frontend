# Shared by every Netlify site deployed from this repo (apps/website
# per business, apps/rtsh-info, ...) — see docs/deployment.md.
#
# Deliberately no [build] command/publish here: netlify.toml settings
# override each site's own dashboard UI settings (Netlify's documented
# precedence, not a bug), so a shared build command here would silently
# win over every site's own per-app override — which is exactly what
# broke the first attempt at a second site (rtsh-info) built from this
# same repo. Each site sets its own Build command/Publish directory
# entirely via its own dashboard now — see docs/deployment.md and
# docs/rtsh-info.md for the exact values per app.
[build.environment]
  NODE_VERSION = "20"

# React Router client-side routes (e.g. /dashboard) must all resolve to
# index.html — otherwise a direct link or refresh 404s.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
