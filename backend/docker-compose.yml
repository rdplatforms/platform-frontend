services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: rdplatforms
      POSTGRES_USER: rdplatforms
      POSTGRES_PASSWORD: rdplatforms
    ports:
      # Host 5433, not 5432 — avoids colliding with any other local Postgres.
      - '5433:5432'
    volumes:
      - rdplatforms-postgres-data:/var/lib/postgresql/data

volumes:
  rdplatforms-postgres-data:
