spring.application.name=backend
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5433/rdplatforms
spring.datasource.username=rdplatforms
spring.datasource.password=rdplatforms

# Flyway owns the schema; Hibernate must never auto-generate/alter DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
